[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caltopo-evidence"
dynamic = ["version"]
description = "Read-only extraction of photos and metadata from a CalTopo map into a checksummed evidence bundle"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Bill Burns" }]
keywords = ["caltopo", "search-and-rescue", "sar", "evidence", "exif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

# Deliberately empty, and treated as a property of the tool rather than an
# accident of its youth. An evidence tool's dependency tree is part of its
# audit surface: every package added here is code a reviewer must account for
# when asked how the bundle was produced. See README, "Integrity".
dependencies = []

[project.urls]
Homepage = "https://github.com/SCCSSAR/caltopo-evidence"
Issues = "https://github.com/SCCSSAR/caltopo-evidence/issues"

[project.scripts]
# Matches `prog=TOOL_NAME` in cli.py, so `caltopo-evidence --help` and
# `python3 -m caltopo_evidence --help` print the same usage line.
caltopo-evidence = "caltopo_evidence.cli:main"

[tool.setuptools]
packages = ["caltopo_evidence"]

# Single source of truth. `__version__` is stamped into every manifest as part
# of the retrieval provenance, so a version that disagreed with the installed
# package would put a wrong claim inside an evidence record. Reading it here
# rather than repeating it makes that disagreement impossible.
[tool.setuptools.dynamic]
version = { attr = "caltopo_evidence.__version__" }
