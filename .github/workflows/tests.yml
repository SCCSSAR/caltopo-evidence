name: tests

on:
  pull_request:
  push:
    branches: [main]

# A PR that gets three quick pushes should not queue three full matrix runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full supported range. 3.9 is the floor claimed by
        # `requires-python`, and an unverified floor is not a floor: the code
        # relies on `from __future__ import annotations` to keep 3.10+ type
        # syntax out of runtime evaluation, and that breaks silently the first
        # time someone writes `X | Y` outside an annotation.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # No install step and no dependencies to fetch. That is the point of
        # the standard-library-only rule, and it is why a five-version matrix
        # costs almost nothing to run.
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install from source
        run: python -m pip install --upgrade pip && pip install .

      - name: Console entry point runs
        # Guards the wiring between `[project.scripts]` and `cli.main`, which
        # the unit tests never touch: they import the modules directly.
        run: |
          caltopo-evidence --version
          caltopo-evidence --help > /dev/null
          caltopo-evidence extract --help > /dev/null
          caltopo-evidence verify --help > /dev/null

      - name: Version is single-sourced
        # `pyproject.toml` reads the version from `caltopo_evidence.__version__`.
        # This fails if that indirection is ever replaced by a literal that then
        # drifts, because the manifest stamps __version__ into every bundle.
        run: |
          python - <<'PY'
          import importlib.metadata as md, caltopo_evidence
          installed, module = md.version("caltopo-evidence"), caltopo_evidence.__version__
          assert installed == module, f"{installed!r} != {module!r}"
          print("version single-sourced:", module)
          PY
